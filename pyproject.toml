[project]
name = "quantpilot"
version = "0.1.0"
description = "초보자용 AI 퀀트 트레이딩 플랫폼 — 코드가 계산하고, 모델은 판단하고, 코드가 실행한다"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # 판단 모델 질문 문구 judgment/questions/*.yaml (P1-07)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2.40",
    "finance-datareader>=0.9.90",
    "pykrx>=1.0.45",
    # 업비트 웹소켓 (P1-03, data/upbit_ws.py). uvicorn[standard]도 끌어오지만 직접 쓰므로 명시
    "websockets>=13",
]
brokers = [
    "pyupbit>=0.2.33",
    "python-kis>=2.0",
    "alpaca-py>=0.30",
]
ai = [
    "anthropic>=0.40",
    "google-genai>=1.0",
]
infra = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # scheduler의 APScheduler 잡 저장소는 동기 드라이버를 쓴다 (scheduler/main.py::sync_url, P1-14)
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "apscheduler>=3.10,<4",  # 4.0은 schedulers.asyncio·jobstores.sqlalchemy API가 없다 (ADR 0029)
    "exchange-calendars>=4.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # DB 테스트(SQLite 인메모리)가 기본 설치에서 건너뛰지 않도록 (P1-01)
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
]

[project.scripts]
qp = "quantpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "invariant: CLAUDE.md 불변식 테스트",
    "integration: TickRunner 통합 테스트",
    "network: 실제 외부 API 호출 (기본 제외)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
# MoAI 설정 문서(.claude)의 예제 코드 블록은 검사 대상이 아님 (P1-14a CI)
extend-exclude = [".claude"]
