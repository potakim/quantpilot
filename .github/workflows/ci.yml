# CI Workflow (P1-14a)
#
# push·PR마다 테스트와 린트를 돌린다 (docs/08-testing.md §7).
#   1. pytest -m "not network"  — 실 API 호출 테스트는 제외
#   2. ruff check .             — 린트
#   3. ruff format --check .    — 서식 (.claude는 pyproject extend-exclude로 제외)
# 이미지 빌드·GHCR push는 P1-14 배포 부분에서 추가한다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: pytest
        run: uv run --no-sync pytest -m "not network"

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  # 웹 화면 (P1-13, ADR 0018). Node 도구는 web/ 안에만 있다 — 위 python 잡과 따로 돈다.
  #   1. eslint(+jsx-a11y) · tsc · vitest · next build · 비밀 누출 검사(check-secrets)
  #   2. 데모 API(scripts/web_demo_api.py, 합성 데이터) + next start
  #   3. Lighthouse 접근성 90+ — 데스크톱 4화면(lighthouserc.json) + 모바일 대시보드(lighthouserc.mobile.json)
  # 아래 비밀번호·시크릿은 데모 API 전용 값이다 (실제 배포와 무관).
  web:
    name: web (lint · test · build · lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      QP_API_URL: http://127.0.0.1:8000
      QP_ADMIN_PASSWORD: demo-ci-password
      QP_JWT_SECRET: demo-ci-jwt-secret-0123456789abcdef-xyz
      LHCI_PASSWORD: demo-ci-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: lint (eslint + jsx-a11y)
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test (vitest)
        run: npm test

      - name: build
        run: npm run build

      - name: 비밀 누출 검사
        run: npm run check-secrets

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: 데모 API 의존성
        working-directory: .
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: 데모 API + next start
        run: |
          (cd .. && nohup uv run --no-sync python scripts/web_demo_api.py > /tmp/demo-api.log 2>&1 &)
          nohup npm run start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && curl -sf http://127.0.0.1:3000/login > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/demo-api.log /tmp/next.log
          exit 1

      - name: Lighthouse 접근성 90+
        run: |
          npm install --no-save --no-audit --no-fund @lhci/cli@0.15.1 puppeteer@24
          npx lhci autorun --config=./lighthouserc.json
          npx lhci autorun --config=./lighthouserc.mobile.json

      - name: Lighthouse 리포트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: web/.lighthouseci
          if-no-files-found: ignore
