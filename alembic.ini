# DB URL comes from QP_DATABASE_URL (default: SQLite data/quantpilot.db), see migrations/env.py.
# Keep this file ASCII-only: alembic reads it with the OS locale encoding (cp949 on Korean Windows).
[alembic]
script_location = %(here)s/quantpilot/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
