# CI Workflow (P1-14)
#
# push·PR마다 테스트와 린트를 돌린다 (docs/08-testing.md §7).
#   1. pytest -m "not network"  — 실 API 호출 테스트는 제외
#   2. ruff check .             — 린트
#   3. ruff format --check .    — 서식 (.claude는 pyproject extend-exclude로 제외)
# web 잡은 화면(P1-13, ADR 0018)을 따로 검사한다.
# 둘 다 통과하면 백엔드·web 이미지를 빌드한다. PR은 빌드만, main push는 GHCR로 올린다 (docs/07 §2, ADR 0019).
# 러너는 VPS와 같은 ubuntu-24.04로 고정한다 (ubuntu-latest가 26으로 바뀌어도 흔들리지 않게).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (py3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv는 주 버전 태그(v10)를 두지 않는다 — 전체 버전으로 고정
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: pytest
        run: uv run --no-sync pytest -m "not network"

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  # 웹 화면 (P1-13, ADR 0018). Node 도구는 web/ 안에만 있다 — 위 python 잡과 따로 돈다.
  #   1. eslint(+jsx-a11y) · tsc · vitest · next build · 비밀 누출 검사(check-secrets)
  #   2. 데모 API(scripts/web_demo_api.py, 합성 데이터) + next start
  #   3. Lighthouse 접근성 90+ — 데스크톱 7화면(lighthouserc.json) + 모바일 대시보드(lighthouserc.mobile.json)
  # 데모 API 비밀번호·시크릿은 실행마다 무작위로 만든다 (저장소에 값 없음).
  web:
    name: web (lint · test · build · lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      QP_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - name: 데모 비밀번호·시크릿 생성 (실행마다 무작위)
        run: |
          pw=$(openssl rand -hex 16)
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$pw"
          echo "::add-mask::$secret"
          {
            echo "QP_ADMIN_PASSWORD=$pw"
            echo "LHCI_PASSWORD=$pw"
            echo "QP_JWT_SECRET=$secret"
          } >> "$GITHUB_ENV"

      # Node 20은 2026-04 지원 종료 — web/Dockerfile과 같은 22 LTS
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: lint (eslint + jsx-a11y)
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test (vitest)
        run: npm test

      - name: build
        run: npm run build

      - name: 비밀 누출 검사
        run: npm run check-secrets

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: 데모 API 의존성
        working-directory: .
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: 데모 API + next start
        run: |
          (cd .. && nohup uv run --no-sync python scripts/web_demo_api.py > /tmp/demo-api.log 2>&1 &)
          nohup npm run start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && curl -sf http://127.0.0.1:3000/login > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/demo-api.log /tmp/next.log
          exit 1

      - name: Lighthouse 접근성 90+
        run: |
          npm install --no-save --no-audit --no-fund @lhci/cli@0.15.1 puppeteer@24
          npx lhci autorun --config=./lighthouserc.json
          npx lhci autorun --config=./lighthouserc.mobile.json

      - name: Lighthouse 리포트
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: web/.lighthouseci
          if-no-files-found: ignore

  image:
    name: images (backend · web)
    needs: [test, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantpilot
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Backend build (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image tags
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantpilot-web
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Web build (push on main)
        uses: docker/build-push-action@v7
        with:
          context: web
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
