# CI Workflow (P1-14a)
#
# push·PR마다 테스트와 린트를 돌린다 (docs/08-testing.md §7).
#   1. pytest -m "not network"  — 실 API 호출 테스트는 제외
#   2. ruff check .             — 린트
#   3. ruff format --check .    — 서식 (.claude는 pyproject extend-exclude로 제외)
# 이미지 빌드·GHCR push는 P1-14 배포 부분에서 추가한다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: pytest
        run: uv run --no-sync pytest -m "not network"

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .
