# CI Workflow (P1-14)
#
# push·PR마다 테스트와 린트를 돌린다 (docs/08-testing.md §7).
#   1. pytest -m "not network"  — 실 API 호출 테스트는 제외
#   2. ruff check .             — 린트
#   3. ruff format --check .    — 서식 (.claude는 pyproject extend-exclude로 제외)
# 테스트가 통과하면 백엔드 이미지를 빌드한다. PR은 빌드만, main push는 GHCR로 올린다 (docs/07 §2, ADR 0019).
# 러너는 VPS와 같은 ubuntu-24.04로 고정한다 (ubuntu-latest가 26으로 바뀌어도 흔들리지 않게).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (py3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: pytest
        run: uv run --no-sync pytest -m "not network"

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  image:
    name: backend image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantpilot
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
